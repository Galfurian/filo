<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>filo</title>
<style nonce="__NONCE__">
:root {
  --page: #0e1117; --panel: #151a23; --bg: #1a202b; --ink: #e6e9f0; --muted: #8a93a6; --line: #262d3b;
  --bubble: #1a202b; --shadow: none; --ok: #3fae7e; --queued: #d9962b; --off: #9a82e0; --bad: #d65c5c;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root { --page: #f3f4f7; --panel: #ffffff; --bg: #eceff4; --ink: #1b2030; --muted: #6c7488; --line: #dde1ea;
          --bubble: #eceff4; --shadow: 0 1px 2px rgba(20,25,40,.06); color-scheme: light; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--page); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
       display: grid; grid-template-columns: 280px 1fr; grid-template-rows: auto 1fr; }
header { grid-column: 1 / 3; display: flex; align-items: center; gap: 14px; padding: 12px 18px;
         background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
header h1 span { color: var(--muted); font-weight: 400; }
header select, header button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
         border-radius: 8px; padding: 5px 10px; cursor: pointer; }
header .spacer { flex: 1; }
header button.on { background: var(--ink); color: var(--page); }
#live { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
#live.up { background: var(--ok); box-shadow: 0 0 0 4px rgba(47,158,110,.18); }
aside { padding: 14px; overflow: auto; border-right: 1px solid var(--line); }
aside h2 { margin: 4px 4px 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.card { display: flex; gap: 10px; align-items: center; padding: 9px 10px; margin-bottom: 8px;
        background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); }
.card .who { min-width: 0; }
.card .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.card .sub { font-size: 12px; color: var(--muted); }
.avatar { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
          color: #fff; font-weight: 700; font-size: 15px; }
.small { width: 26px; height: 26px; font-size: 12px; }
.warn { color: var(--queued); }
main { overflow: auto; padding: 18px 22px 40px; position: relative; }
.empty { color: var(--muted); text-align: center; margin-top: 80px; }
.row { display: flex; gap: 10px; margin: 10px 0; align-items: flex-end; max-width: 880px; }
.bubble { background: var(--bubble); border-radius: 16px 16px 16px 4px; padding: 9px 13px; box-shadow: var(--shadow);
          min-width: 0; max-width: 100%; }
.bubble .head { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 2px; }
.bubble .head b { color: var(--ink); }
.bubble .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.badge { font-size: 11px; border-radius: 999px; padding: 0 8px; color: #fff; align-self: center; }
.badge.delivered { background: var(--ok); } .badge.queued { background: var(--queued); }
.badge.offline { background: var(--off); } .badge.unreachable, .badge.failed { background: var(--bad); }
.dim { color: var(--muted); font-style: italic; }
.note { text-align: center; color: var(--muted); font-size: 12px; margin: 14px 0; }
#more { position: sticky; bottom: 10px; margin: 0 auto; display: none; width: max-content; background: var(--ink);
        color: var(--bg); border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: 13px; }
body[data-theme="log"] .row { display: block; margin: 0; max-width: none; }
body[data-theme="log"] .avatar { display: none; }
body[data-theme="log"] .bubble { border-radius: 0; box-shadow: none; background: transparent; padding: 2px 0;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; border-bottom: 1px solid var(--line); }
body[data-theme="log"] .bubble .head { display: inline-flex; margin: 0 10px 0 0; }
body[data-theme="log"] .bubble .text { display: inline; }
#board { display: none; padding: 18px 22px 40px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px; align-content: start; }
body[data-theme="board"] #feed, body[data-theme="board"] #more { display: none; }
body[data-theme="board"] #board { display: grid; }
/* The board: every entity has a box, the boxes fill the page, and arrows run in the gaps between them. */
body[data-theme="board"] { grid-template-columns: 1fr; }
body[data-theme="board"] aside, body[data-theme="board"] #feed, body[data-theme="board"] #more { display: none; }
body[data-theme="board"] header { grid-column: 1; }
body[data-theme="board"] main { overflow: hidden; padding: 0; }
#board { display: none; position: absolute; inset: 0; padding: 24px; gap: 36px; }
body[data-theme="board"] #board { display: grid; }
.desk { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; min-height: 0;
        display: flex; flex-direction: column; overflow: hidden; transition: border-color .4s, box-shadow .4s; }
.desk.hit { border-color: hsl(var(--h) 70% 62%); box-shadow: 0 0 0 1px hsl(var(--h) 70% 62% / .6); }
.desk.gone { opacity: .55; }
.desk .top { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex: none; }
.desk .avatar { width: 34px; height: 34px; border-radius: 8px; font-size: 14px; }
.desk .title { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.desk .name { font-weight: 600; }
.says { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; overscroll-behavior: contain;
        scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.says > :first-child { margin-top: auto; }   /* the newest at the bottom, and the whole history reachable above it */
.desk { position: relative; }
.more { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: none; border: 0; border-radius: 999px; padding: 3px 12px;
        background: hsl(var(--h) 60% 52%); color: #fff; font: inherit; font-size: 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.said { border-left: 2px solid hsl(var(--from, 215) 55% 55%); padding: 1px 0 1px 10px; font-size: 13.5px; overflow-wrap: anywhere; flex: none; }
.said.pop { animation: arrive .5s ease-out; }
@keyframes arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.said .to { font-size: 11px; color: var(--muted); }
.said .text { white-space: pre-wrap; }
.said.lost { border-left-style: dashed; border-left-color: var(--bad); color: var(--muted); }
.desk .expand { margin-left: auto; flex: none; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px;
        width: 26px; height: 26px; font-size: 14px; line-height: 1; cursor: pointer; }
.desk .expand:hover { color: var(--ink); border-color: var(--muted); }
#focus { display: none; position: fixed; inset: 0; z-index: 30; background: rgba(5, 8, 14, .62); place-items: center; }
#focus.open { display: grid; }
.sheet { width: min(980px, 92vw); height: min(86vh, 920px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
         display: flex; flex-direction: column; padding: 16px 20px 12px; box-shadow: 0 24px 80px rgba(0,0,0,.5); }
.fhead { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex: none; }
.fhead .grow { flex: 1; min-width: 0; }
.fhead input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; width: 200px; }
.fhead button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
#fchips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; flex: none; }
#fchips button { font: inherit; font-size: 12.5px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 2px 11px; cursor: pointer; }
#fchips button.on { color: var(--page); background: var(--ink); border-color: var(--ink); }
#flist { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
#flist > :first-child { margin-top: auto; }
#flist .said { font-size: 14.5px; }
.desk .col { min-width: 0; flex: 1; }
.badge-q { display: inline-block; font-size: 11.5px; border-radius: 999px; padding: 1px 9px; margin-top: 3px; color: #1a1205; background: var(--queued); white-space: nowrap; }
.badge-q.stale { color: #fff; background: var(--bad); }
#fly { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
.packet { position: fixed; left: 0; top: 0; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 2px; z-index: 21; pointer-events: none; offset-rotate: 0deg; }
@media (max-width: 760px) { body { grid-template-columns: 1fr; } aside { display: none; } header { grid-column: 1; } }
</style>
</head>
<body data-theme="board">
<header>
  <h1>filo <span>pool</span></h1>
  <select id="scope" title="scope"></select>
  <span class="spacer"></span>
  <button data-theme="board" class="on">Board</button>
  <button data-theme="log">Log</button>
  <span id="live" title="live"></span>
</header>
<aside><h2>In this scope</h2><div id="roster"></div></aside>
<main id="main"><div id="board"></div><div id="feed"></div><div id="more">new messages</div></main>
<div id="focus"><div class="sheet">
  <div class="fhead"><div id="favatar"></div><div class="grow" id="ftitle"></div><input id="fsearch" type="search" placeholder="search" autocomplete="off"><button id="fclose" title="Esc">Close</button></div>
  <div id="fchips"></div><div id="flist"></div></div></div>
<svg id="fly" xmlns="http://www.w3.org/2000/svg"><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs></svg>
<script nonce="__NONCE__">
"use strict";
// Everything that comes from the pool is text from an agent: it goes in with textContent and nowhere else.
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
// A colour for each one: the client sets the family (Claude blue, Codex green, agy amber, OpenCode violet) and the
// name moves it a little; a listener has no client, so its name alone picks the colour.
const COLORS = { claude: 215, codex: 155, agy: 32, opencode: 275 };
const hue = (name, client) => { let h = 7; for (const c of name) h = (h * 33 + c.charCodeAt(0)) % 3600; return client in COLORS ? (COLORS[client] + (h % 30) - 15 + 360) % 360 : (h * 37) % 360; };
// Why a message has no text: it was sent before the log of this pool began (nothing kept it), or after, and then the filo of its sender
// did not write it (an older filo, or FILO_NO_LOG=1).
const noText = (e) => e.before_log === false ? "no text in the log: the filo of its sender did not write it (an older filo, or FILO_NO_LOG)" : "sent before this pool kept a log: its text is gone";
const unknown = () => { const a = el("div", "avatar", "?"); a.style.background = "var(--muted)"; return a; };
const avatar = (name, client, small) => { const a = el("div", "avatar" + (small ? " small" : ""), name.slice(0, 1).toUpperCase()); a.style.background = `hsl(${hue(name, client)} 55% 48%)`; return a; };
const clock = (ns) => new Date(Number(ns) / 1e6).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
const kinds = new Map();   // name -> client, as the roster says it
let source = null, current = null;

// The board. The boxes are laid out on a grid that fills the page, so the gaps between them are straight corridors, and an
// arrow is routed through those corridors only: it leaves a side of the sender, turns at the crossings, and enters a side of the
// recipient without crossing any other box.
const desks = new Map(), received = new Map();
const STATE = { delivered: "#3fae7e", queued: "#d9962b", offline: "#9a82e0", unreachable: "#d65c5c", failed: "#d65c5c" };
let grid = { cols: 1, rows: 1, order: [] };
function desk(name, client, sub) {
  let d = desks.get(name);
  if (!d) {
    const box = el("div", "desk"), top = el("div", "top"), who = el("div", "title"), says = el("div", "says");
    box.style.setProperty("--h", hue(name, client));
    who.append(el("b", "name", name), el("span", "sub", sub ? " · " + sub : ""));   // one line: name · client · pid, or registered
    const more = el("button", "more", "↓ new"), expand = el("button", "expand", "⤢"); expand.title = "open the whole history";
    const col = el("div", "col"); col.append(who);   // the title, and under it what waits in the queue when something does
    box.append(top, says, more); top.append(avatar(name, client), col, expand); $("board").append(box);
    d = { box, says, who, more, top, col, expand, badge: null, stick: true };
    expand.onclick = () => openFocus(name); who.ondblclick = () => openFocus(name);
    says.addEventListener("scroll", () => { d.stick = says.scrollHeight - says.scrollTop - says.clientHeight < 24; if (d.stick) more.style.display = "none"; });
    more.onclick = () => { says.scrollTop = says.scrollHeight; };
    desks.set(name, d);
  }
  return d;
}
function layoutBoard() {
  const board = $("board"), order = [...desks.keys()].sort(), n = order.length;
  if (!n) return;
  const w = board.clientWidth || innerWidth, h = board.clientHeight || innerHeight;
  let cols = Math.min(n, Math.max(1, Math.ceil(Math.sqrt(n * (w / h) / 1.15))));
  while (cols > 1 && (cols - 1) * Math.ceil(n / cols) >= n) cols--;
  const rows = Math.ceil(n / cols);
  board.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`; board.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
  // A stable place for each, by name. A box is moved only when it is out of place: moving an element makes the animations in it
  // start again, and this runs at every roster event.
  const placed = [...board.children];
  if (order.some((name, i) => placed[i] !== desks.get(name).box)) for (const name of order) board.append(desks.get(name).box);
  grid = { cols, rows, order };
}
// The whole history that the page has is in the box, to be scrolled. At the bottom it follows what comes; scrolled up it stays where
// it is, and says that something new came.
const KEEP = 300;
function renderDesk(name, popLast) {
  const d = desks.get(name), before = d.says.scrollTop, stuck = d.stick;
  d.says.replaceChildren();
  const all = received.get(name) ?? []; if (all.length > KEEP) all.splice(0, all.length - KEEP);
  const list = all;
  list.forEach((e, i) => {
    const m = el("div", "said" + (e.lost ? " lost" : "") + (popLast && i === list.length - 1 ? " pop" : ""));
    const who = e.lost ? e.to : (e.from ?? "someone"); m.style.setProperty("--from", hue(who, kinds.get(who)));
    m.append(el("div", "to", `${e.lost ? "→" : "←"} ${who} · ${clock(e.t)} · ${e.state}`),
             el("div", "text" + (e.body == null ? " dim" : ""), e.lost ? "nobody there to receive it" : (e.body ?? noText(e))));
    if (m.classList.contains("pop")) m.addEventListener("animationend", () => m.classList.remove("pop"), { once: true });
    d.says.append(m);
  });
  if (stuck) d.says.scrollTop = d.says.scrollHeight;
  else { d.says.scrollTop = before; if (popLast) d.more.style.display = "block"; }
}

// The corridors: a lattice of crossings (gx[j], gy[i]) joined along the gaps; each box has four ports, the middle of a side, joined
// by a short stub to the corridor next to it. The route is the cheapest one over that lattice, a bend costing more than a step.
function corridors() {
  const { cols, rows, order } = grid, rect = (i) => desks.get(order[i]).box.getBoundingClientRect(), br = $("board").getBoundingClientRect();
  const colL = [], colR = [], rowT = [], rowB = [];
  for (let c = 0; c < cols; c++) { const r = rect(c); colL.push(r.left); colR.push(r.right); }
  for (let r = 0; r < rows; r++) { const q = rect(r * cols); rowT.push(q.top); rowB.push(q.bottom); }
  const gx = [Math.max(br.left + 6, colL[0] - 16)], gy = [Math.max(br.top + 6, rowT[0] - 16)];
  for (let c = 1; c < cols; c++) gx.push((colR[c - 1] + colL[c]) / 2);
  for (let r = 1; r < rows; r++) gy.push((rowB[r - 1] + rowT[r]) / 2);
  gx.push(Math.min(br.right - 6, colR[cols - 1] + 16)); gy.push(Math.min(br.bottom - 6, rowB[rows - 1] + 16));
  return { gx, gy, colL, colR, rowT, rowB, rect };
}
function route(fromName, toName) {
  const { cols, rows, order } = grid, g = corridors(), key = (j, i) => `${j},${i}`, edges = new Map(), at = new Map();
  const link = (a, b, len, dir) => { if (!edges.has(a)) edges.set(a, []); if (!edges.has(b)) edges.set(b, []); edges.get(a).push([b, len, dir]); edges.get(b).push([a, len, dir]); };
  for (let i = 0; i <= rows; i++) for (let j = 0; j <= cols; j++) {
    at.set(key(j, i), [g.gx[j], g.gy[i]]);
    if (j < cols) link(key(j, i), key(j + 1, i), g.gx[j + 1] - g.gx[j], "h");
    if (i < rows) link(key(j, i), key(j, i + 1), g.gy[i + 1] - g.gy[i], "v");
  }
  const ports = (name, tag) => {
    const idx = order.indexOf(name), r = Math.floor(idx / cols), c = idx % cols, q = g.rect(idx), cx = (q.left + q.right) / 2, cy = (q.top + q.bottom) / 2, found = [];
    const add = (side, edge, stub, a, b, dir) => {
      const id = `${tag}:${side}`; at.set(id, stub); found.push({ id, edge, stub });
      for (const t of [a, b]) { const p = at.get(t); link(id, t, Math.abs(p[0] - stub[0]) + Math.abs(p[1] - stub[1]), dir); }
    };
    add("r", [q.right, cy], [g.gx[c + 1], cy], key(c + 1, r), key(c + 1, r + 1), "v");
    add("l", [q.left, cy], [g.gx[c], cy], key(c, r), key(c, r + 1), "v");
    add("t", [cx, q.top], [cx, g.gy[r]], key(c, r), key(c + 1, r), "h");
    add("b", [cx, q.bottom], [cx, g.gy[r + 1]], key(c, r + 1), key(c + 1, r + 1), "h");
    return found;
  };
  const src = ports(fromName, "s"), dst = toName ? ports(toName, "d") : [];
  // Dijkstra over (node, direction): a change of direction costs a little more than a step of the same length.
  const BEND = 60, best = new Map(), prev = new Map(), queue = [];
  const push = (cost, node, dir, from) => { const k = node + "|" + dir; if (best.has(k) && best.get(k) <= cost) return; best.set(k, cost); prev.set(k, from); queue.push([cost, node, dir]); };
  for (const p of src) push(0, p.id, "", null);
  const goal = new Set(dst.map((p) => p.id)); let end = null;
  while (queue.length) {
    queue.sort((a, b) => a[0] - b[0]); const [cost, node, dir] = queue.shift(), k = node + "|" + dir;
    if (cost > best.get(k)) continue;
    if (goal.has(node)) { end = k; break; }
    for (const [next, len, d] of edges.get(node) ?? []) {
      if (next.startsWith("s:") || (next.startsWith("d:") && !goal.has(next))) continue;
      push(cost + len + (dir && dir !== d ? BEND : 0), next, d, k);
    }
  }
  if (!end) return null;
  const chain = []; for (let k = end; k; k = prev.get(k)) chain.push(k.split("|")[0]); chain.reverse();
  const first = src.find((p) => p.id === chain[0]), last = dst.find((p) => p.id === chain[chain.length - 1]);
  const pts = [first.edge, ...chain.map((id) => at.get(id)), last.edge];
  return pts.filter((p, i) => i === 0 || p[0] !== pts[i - 1][0] || p[1] !== pts[i - 1][1]);
}
function rounded(points, radius = 10) {
  let d = `M ${points[0][0]} ${points[0][1]}`;
  for (let i = 1; i < points.length - 1; i++) {
    const [px, py] = points[i - 1], [x, y] = points[i], [nx, ny] = points[i + 1];
    const a = Math.min(radius, Math.hypot(x - px, y - py) / 2), b = Math.min(radius, Math.hypot(nx - x, ny - y) / 2);
    const ux = Math.sign(x - px), uy = Math.sign(y - py), vx = Math.sign(nx - x), vy = Math.sign(ny - y);
    d += ` L ${x - ux * a} ${y - uy * a} Q ${x} ${y} ${x + vx * b} ${y + vy * b}`;
  }
  const [lx, ly] = points[points.length - 1]; return d + ` L ${lx} ${ly}`;
}
function fly(fromName, toName, state, done) {
  const points = route(fromName, desks.has(toName ?? "") ? toName : null);
  if (!points || points.length < 2) { done(); return; }
  const reaches = desks.has(toName ?? ""), colour = STATE[state] ?? "#8a93a6", d = rounded(points), svg = $("fly");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", d); path.setAttribute("fill", "none"); path.setAttribute("stroke", colour); path.setAttribute("stroke-width", "2");
  path.setAttribute("stroke-linejoin", "round"); if (reaches) path.setAttribute("marker-end", "url(#tip)"); svg.append(path);
  const length = path.getTotalLength(); path.style.strokeDasharray = length;
  path.animate([{ strokeDashoffset: length }, { strokeDashoffset: 0 }], { duration: 600, easing: "ease-in-out", fill: "forwards" });
  const packet = el("div", "packet"); packet.style.background = colour; packet.style.offsetPath = `path("${d}")`; document.body.append(packet);
  const move = packet.animate([{ offsetDistance: "0%" }, { offsetDistance: "100%" }], { duration: 700, easing: "ease-in-out", fill: "forwards" });
  move.onfinish = () => { packet.remove(); done(); path.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 800, delay: 300, fill: "forwards" }).onfinish = () => path.remove(); };
}
// One message arrives once on the board, whatever the number of ways that the page hears of it: a filo that writes the log and
// a listener's inbox both say it. The log says more (sender, state), so it replaces what the older file said.
const onBoardIds = new Map();   // id -> { name, event, upgrade }
function onBoard(e, live) {
  if (e.kind !== "message") return;
  const known = e.id ? onBoardIds.get(e.id) : undefined;
  if (known) {
    if (e.kept) return;
    if (!known.event) { known.upgrade = e; return; }          // still on its way: it lands as the richer one
    const list = received.get(known.name), at = list.indexOf(known.event);
    if (at >= 0) { const next = known.event.lost ? { ...e, lost: true } : e; swapLedger(known.event, next); list[at] = next; known.event = next; renderDesk(known.name, false); renderFocus(false); }
    return;
  }
  const entry = { name: null, event: null, upgrade: null };
  if (e.id) onBoardIds.set(e.id, entry);
  const to = desks.get(e.to);
  const land = () => {
    const m = entry.upgrade ?? e;
    if (!to) { const sender = m.from ?? "someone"; desk(sender, kinds.get(sender)); if (!received.has(sender)) received.set(sender, []); entry.name = sender; entry.event = { ...m, lost: true }; received.get(sender).push(entry.event); ledger.push(entry.event); renderDesk(sender, live); renderFocus(live); return; }
    if (!received.has(e.to)) received.set(e.to, []);
    entry.name = e.to; entry.event = m; received.get(e.to).push(m); ledger.push(m); if (ledger.length > 3000) ledger.splice(0, ledger.length - 3000); renderDesk(e.to, live); renderFocus(live);
    if (live) { to.box.classList.add("hit"); setTimeout(() => to.box.classList.remove("hit"), 1500); }
  };
  if (live && e.from && desks.has(e.from) && e.from !== e.to) fly(e.from, e.to, e.state, land); else land();
}

// The zoom: the whole conversation of one entity in a sheet over the board, what it received and what it sent, with a filter by the one it
// talks with and a search. The board stays as it is behind it.
const ledger = [];   // every message that has landed, once
let focused = null, focusWith = "", focusText = "", focusStick = true;
function swapLedger(was, now) { const i = ledger.indexOf(was); if (i >= 0) ledger[i] = now; }
const other = (name, e) => (e.to === name ? (e.from ?? "someone") : e.to);
function renderFocus(popLast) {
  if (!focused) return;
  const list = $("flist"), before = list.scrollTop, stuck = focusStick;
  const all = ledger.filter((e) => e.to === focused || e.from === focused).sort((a, b) => a.t - b.t), counts = new Map();
  for (const e of all) counts.set(other(focused, e), (counts.get(other(focused, e)) ?? 0) + 1);
  const chips = $("fchips"); chips.replaceChildren();
  const chip = (label, who) => { const b = el("button", focusWith === who ? "on" : "", label); b.onclick = () => { focusWith = who; focusStick = true; renderFocus(false); }; chips.append(b); };
  chip(`all (${all.length})`, ""); for (const [who, n] of [...counts].sort((a, b) => b[1] - a[1])) chip(`${who} (${n})`, who);
  const text = focusText.toLowerCase(), shown = all.filter((e) => (!focusWith || other(focused, e) === focusWith) && (!text || (e.body ?? "").toLowerCase().includes(text)));
  list.replaceChildren();
  if (!shown.length) list.append(el("div", "empty", "nothing here"));
  for (const e of shown) {
    const who = other(focused, e), m = el("div", "said" + (e.lost ? " lost" : ""));
    m.style.setProperty("--from", hue(e.from ?? who, kinds.get(e.from ?? who)));
    m.append(el("div", "to", `${e.to === focused ? "←" : "→"} ${who} · ${clock(e.t)} · ${e.state}`), el("div", "text" + (e.body == null ? " dim" : ""), e.lost ? "nobody there to receive it" : (e.body ?? noText(e))));
    list.append(m);
  }
  list.scrollTop = stuck ? list.scrollHeight : before;
}
function openFocus(name) {
  focused = name; focusWith = ""; focusText = ""; focusStick = true; $("fsearch").value = "";
  $("favatar").replaceChildren(avatar(name, kinds.get(name))); $("ftitle").replaceChildren(el("b", "name", name), el("span", "sub", desks.get(name).who.lastChild.textContent));
  $("focus").classList.add("open"); renderFocus(false);
}
function closeFocus() { focused = null; $("focus").classList.remove("open"); }
$("fclose").onclick = closeFocus;
$("focus").addEventListener("click", (ev) => { if (ev.target === $("focus")) closeFocus(); });
addEventListener("keydown", (ev) => { if (ev.key === "Escape" && focused) closeFocus(); });
$("fsearch").oninput = () => { focusText = $("fsearch").value; renderFocus(false); };
$("flist").onscroll = () => { const l = $("flist"); focusStick = l.scrollHeight - l.scrollTop - l.clientHeight < 24; };

function showRoster(r) {
  const box = $("roster"); box.replaceChildren(); kinds.clear();
  const rows = [...r.participants.map((p) => ({ name: p.name, client: p.client ?? "listener", sub: (p.client ?? "listener") + " · pid " + p.pid, old: p.version, version: p.version })),
                ...r.registered.map((g) => ({ name: g.name, client: g.client, sub: g.client + " · registered", waiting: g.waiting, oldest: g.oldest_seconds }))];
  if (!rows.length) box.append(el("div", "sub", "nobody is connected"));
  for (const row of rows) {
    kinds.set(row.name, row.client); const d = desk(row.name, row.client, row.sub); d.who.lastChild.textContent = row.sub ? " · " + row.sub : "";
    if (row.waiting > 0) {   // what waits in the queue of its client: it takes it when it is free, and a long wait means that it is busy
      if (!d.badge) { d.badge = el("div", "badge-q"); d.col.append(d.badge); }
      d.badge.classList.toggle("stale", row.oldest >= 1800);
      d.badge.textContent = `${row.waiting} waiting · ${Math.max(1, Math.round(row.oldest / 60))} min`;
      d.badge.title = `${row.waiting} messages wait in the queue of its client, the oldest for ${Math.max(1, Math.round(row.oldest / 60))} min: ${row.oldest >= 1800 ? "it is likely stuck in one long turn" : "it is probably busy"}`;
    } else if (d.badge) { d.badge.remove(); d.badge = null; }
    if (!received.has(row.name)) received.set(row.name, []);
    const card = el("div", "card"), who = el("div", "who");
    who.append(el("div", "name", row.name), el("div", "sub", row.sub));
    if (row.waiting) who.append(el("div", "sub warn", (row.oldest >= 1800 ? "stuck? " : "") + row.waiting + " waiting, oldest " + Math.round(row.oldest / 60) + " min"));
    card.append(avatar(row.name, row.client), who); box.append(card);
  }
  for (const [name, d] of desks) d.box.classList.toggle("gone", !kinds.has(name));
  layoutBoard();
}
addEventListener("resize", () => layoutBoard());

const shown = new Map();   // id -> the row of a message that is on the page: one message is shown once

function addEvent(e, feed) {
  if (e.kind === "presence") { feed.append(el("div", "note", `${clock(e.t)} · ${e.name} ${e.event}`)); return; }
  if (e.kind !== "message") return;
  const old = e.id ? shown.get(e.id) : undefined;
  if (old && e.kept) return;                       // what an older filo kept says less than the log does
  const sender = e.from ?? "someone", row = el("div", "row"), bubble = el("div", "bubble"), head = el("div", "head");
  head.append(el("b", "", sender), el("span", "", "→ " + e.to), el("span", "", clock(e.t)), el("span", "badge " + e.state, e.state));
  bubble.append(head, e.body === null || e.body === undefined ? el("div", "text dim", noText(e)) : el("div", "text", e.body));
  if (e.error) bubble.append(el("div", "sub warn", e.error));
  if (e.truncated) bubble.append(el("div", "sub", `cut: ${e.length} characters`));
  row.append(e.from ? avatar(sender, kinds.get(sender)) : unknown(), bubble);
  if (old) old.replaceWith(row); else feed.append(row);
  if (e.id) shown.set(e.id, row);
}

function seat(events) {
  let added = false;
  for (const e of events) if (e.kind === "message" && e.from && !desks.has(e.from)) { desk(e.from, kinds.get(e.from)).box.classList.add("gone"); added = true; }
  if (added) layoutBoard();
}
function append(events, live) {
  seat(events);
  const main = $("main"), feed = $("feed"), atEnd = main.scrollHeight - main.scrollTop - main.clientHeight < 80;
  for (const e of events) { addEvent(e, feed); onBoard(e, live); }
  if (atEnd) main.scrollTop = main.scrollHeight; else if (events.length) $("more").style.display = "block";
}

async function open(scope) {
  current = scope; if (source) source.close();
  const state = await (await fetch("/api/state?scope=" + encodeURIComponent(scope))).json();
  closeFocus(); ledger.length = 0;
  $("board").replaceChildren(); desks.clear(); received.clear(); onBoardIds.clear();
  showRoster(state); $("feed").replaceChildren(); shown.clear();
  if (!state.events.length) $("feed").append(el("div", "empty", "Nothing has been said in this scope yet."));
  else append(state.events, false);
  $("main").scrollTop = $("main").scrollHeight;
  source = new EventSource(`/api/stream?scope=${encodeURIComponent(scope)}&offset=${state.offset}&since=${state.since_ns}`);
  source.onopen = () => $("live").classList.add("up"); source.onerror = () => $("live").classList.remove("up");
  source.addEventListener("roster", (m) => showRoster(JSON.parse(m.data)));
  source.addEventListener("events", (m) => { const empty = $("feed").querySelector(".empty"); if (empty) empty.remove(); append(JSON.parse(m.data).events, true); });
}

async function start() {
  const { scopes } = await (await fetch("/api/scopes")).json(), select = $("scope");
  for (const s of scopes) { const o = el("option", "", `${s.scope}  (${s.participants + s.registered})`); o.value = s.scope; select.append(o); }
  select.onchange = () => { location.hash = select.value; open(select.value); };
  if (!scopes.length) { $("feed").append(el("div", "empty", "No scope has anybody in it. Run /filo in a session.")); return; }
  const wanted = decodeURIComponent(location.hash.slice(1)), first = scopes.find((s) => s.scope === wanted) ?? scopes.find((s) => s.participants + s.registered) ?? scopes[0];
  select.value = first.scope; open(first.scope);
}
for (const b of document.querySelectorAll("button[data-theme]")) b.onclick = () => {
  document.body.dataset.theme = b.dataset.theme; localStorage.setItem("filo-theme", b.dataset.theme);
  for (const o of document.querySelectorAll("button[data-theme]")) o.classList.toggle("on", o === b);
};
const saved = localStorage.getItem("filo-theme"); if (saved === "log") document.querySelector(`button[data-theme="${saved}"]`)?.click();
$("more").onclick = () => { $("main").scrollTop = $("main").scrollHeight; $("more").style.display = "none"; };
$("main").onscroll = () => { const m = $("main"); if (m.scrollHeight - m.scrollTop - m.clientHeight < 80) $("more").style.display = "none"; };
start();
</script>
