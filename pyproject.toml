[project]
name = "filo"
version = "0.3.0"
description = "Direct local messaging between interactive LLM sessions"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["actionlint-py", "hypothesis", "mypy", "pyright", "ruff", "zizmor"]

[tool.pyright]
include = ["filo.py", "tests"]
strict = ["filo.py"]
pythonVersion = "3.10"
enableTypeIgnoreComments = false

[tool.mypy]
files = ["filo.py"]
python_version = "3.10"
strict = true
