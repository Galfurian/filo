name: ci

on:
  push:
    branches: [main] # a branch with a pull request is checked by that, and not twice
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # what lands on main is always checked whole

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # the tests start listeners: a hang would run for six hours
    strategy:
      fail-fast: false # one version failing does not hide how the other does
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: mypy
      - run: pyright
      - run: shellcheck -s sh install.sh uninstall.sh get.sh scripts/common.sh
      - run: actionlint
      - run: zizmor --offline .github/workflows

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
