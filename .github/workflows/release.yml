name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the files
      id-token: write # sign without a key, and attest the build
      attestations: write # store the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the history of main, to see that the tag is on it
      - name: Check the tag before anything is signed
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME is not v$version"; exit 1; }
          # A release is built from what was reviewed and merged, not from whatever a tag points at.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }
          # Signing writes to a public log, so what a release needs is looked for before, not after.
          test -f "docs/releases/$GITHUB_REF_NAME.md" || { echo "no release notes in docs/releases/$GITHUB_REF_NAME.md"; exit 1; }
      - name: Build the archive
        run: git archive --format=tar.gz --prefix="filo-${GITHUB_REF_NAME#v}/" -o "filo-${GITHUB_REF_NAME#v}.tar.gz" "$GITHUB_SHA"
      - name: Stamp get.sh with this version and the hash of the archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          hash=$(sha256sum "filo-$version.tar.gz" | cut -d ' ' -f 1)
          sed -e "s/^version=\"@VERSION@\"\$/version=\"$version\"/" \
              -e "s/^sha256=\"@SHA256@\"\$/sha256=\"$hash\"/" get.sh > get.sh.stamped
          mv get.sh.stamped get.sh
          chmod +x get.sh
          grep -qx "version=\"$version\"" get.sh
          grep -qx "sha256=\"$hash\"" get.sh
          if grep -q '@VERSION@\|@SHA256@' get.sh; then echo "get.sh still has a placeholder"; exit 1; fi
          sh -n get.sh
          sha256sum "filo-$version.tar.gz" get.sh > SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the archive and get.sh
        run: |
          cosign sign-blob --yes --bundle "filo-${GITHUB_REF_NAME#v}.tar.gz.sigstore.json" "filo-${GITHUB_REF_NAME#v}.tar.gz"
          cosign sign-blob --yes --bundle get.sh.sigstore.json get.sh
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: |
            filo-*.tar.gz
            get.sh
            SHA256SUMS
      - name: Keep the provenance as a file of the release
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          python3 - <<'PY'
          import json, os
          text = open(os.environ["BUNDLE"], encoding="utf-8").read().lstrip()
          bundle, _ = json.JSONDecoder().raw_decode(text)
          name = os.environ["GITHUB_REF_NAME"].lstrip("v")
          with open(f"filo-{name}.intoto.jsonl", "w", encoding="utf-8") as out:
              out.write(json.dumps(bundle, separators=(",", ":")) + "\n")
          PY
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" filo-*.tar.gz filo-*.tar.gz.sigstore.json filo-*.intoto.jsonl get.sh get.sh.sigstore.json SHA256SUMS SHA256SUMS.sigstore.json --title "filo ${GITHUB_REF_NAME#v}" --notes-file "docs/releases/$GITHUB_REF_NAME.md" --verify-tag
