name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag is the version in pyproject.toml
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME is not v$version"; exit 1; }
      - name: Build the archive
        run: git archive --format=tar.gz --prefix="filo-${GITHUB_REF_NAME#v}/" -o "filo-${GITHUB_REF_NAME#v}.tar.gz" "$GITHUB_REF_NAME"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the archive
        run: cosign sign-blob --yes --bundle "filo-${GITHUB_REF_NAME#v}.tar.gz.sigstore.json" "filo-${GITHUB_REF_NAME#v}.tar.gz"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: filo-*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum filo-*.tar.gz > SHA256SUMS
          notes="docs/releases/$GITHUB_REF_NAME.md"
          test -f "$notes" || { echo "no release notes in $notes"; exit 1; }
          gh release create "$GITHUB_REF_NAME" filo-*.tar.gz filo-*.tar.gz.sigstore.json SHA256SUMS --title "filo ${GITHUB_REF_NAME#v}" --notes-file "$notes" --verify-tag
