version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must be the same version, so they cannot be bumped one at a time.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
